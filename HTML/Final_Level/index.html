<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>"Final Level"</title>
</head>
<body>
    <h1>"Lists Creation:"</h1>
    <!--Unordered Lists: Each item/Element will have bullets.-->
    <ul> <!--Unordered List-->
        <li>Item1</li> <!--List Item-->
        <li>Item2</li>
    </ul>
    <ul>
        <li>Item1</li>
        <!--List inside a list.-->
        <ul>
            <li>Item_Feature</li>
        </ul>
    </ul>
    <ol> <!--Ordered List: Each Item/Element will have numerals.-->
        <li>Item1</li>
        <li>Item2</li>
    </ol>
    <ol>
        <li>Item1</li>
        <ol>
            <li>Item_Feature</li>
        </ol>
    </ol>
    <h1>"Table Creation:"</h1>
    <table>
        <caption>Table Main Heading:</caption>
        <thead> <!--Table Head: Contains table header data.-->
        <tr> <!--Table Row-1-->
            <th colspan="3">Column-1</th> <!--Table Header: Column Names | colspan : Shows how much space a column would take.
            colspan = "1" means that the column will take 1 column space-->
            <th colspan="3">Column-2</th>
        </tr>
        </thead> <!--1st Row Will Be The Header Portion-->
        <tbody> <!--Table Body: Contains table data.-->
        <tr> <!--Table Row-2-->
            <td colspan="3"> <!--Table Data(Cell-1)-->
                 Data-1 </td>
            <td colspan="3"> Data-2</td>
        </tr>
        </tbody>
    </table>
</body>
</html>
