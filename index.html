<!--This is my first HTML Code File-->
<!--This is how comments are written in HTML-->
<!--This is standard boilerplate for starting or writting html code-->
<!DOCTYPE html> <!--This declaration tells that the web page or document is an HTML5 document or web page.-->
<html lang="en"> <!--Root element tag , default language of the document is english.-->
    <head> <!--Meta Information Section: Machine readable instructions that are not displayed but controls how the browser should render the html page.-->
        <meta charset="UTF-8"> <!--Character Set(Encoding)="UTF-8": Support every text and symbol in every language, helps the browser to know how to encode the text and symbols in a web page.-->
        <meta name="viewport" content="width=device-width , initial-scale=1.0"> <!--This name parameter is used for selecting settings to be changed and the content parameter is the actual settings. width=device-width: Sets the page width to device's screen width , initial-scale=1.0: Sets the default zoom to normal.-->
        <title> First Website</title> <!--Setting the title of the web page.-->
    </head> <!--End Of Meta Info Section.-->
    <body> <!--Start of Body Section: This is the actual part that is displayed by the browser.-->
        <h1>"Welcome!"</h1> <!--First Big Heading.-->
        <p>"This is 1st Website Page"</p> <!--First Paragraph.-->
    </body> <!--End Of Body Section.-->
</html> <!--End Of html root element.-->
